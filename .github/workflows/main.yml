name: Daily Stock RSI Report

on:
  schedule:
    # 한국 시간 오후 3시 45분 (UTC 06:45)
    # 정각을 피해서 설정하면 대기열 지연을 줄일 수 있습니다.
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 lxml tabulate

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_report.py
